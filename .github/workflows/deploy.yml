name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # GitHub disables schedule triggers after 60 days without repository
      # activity, which is what silenced this dashboard. data.json is not
      # committed — the Pages artifact below already carries it — so push an
      # empty commit well inside that window instead. commit-tree builds the
      # commit directly on origin/main without touching the working tree, so a
      # stale checkout cannot cause a non-fast-forward push. This runs before
      # the build so a broken build cannot let the schedule lapse. Pushes made
      # with GITHUB_TOKEN do not trigger workflow runs, so this cannot loop.
      - name: Keepalive
        run: |
          git fetch origin main
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct origin/main) ) / 86400 ))
          echo "Days since last commit: $age"
          if [ "$age" -ge 30 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            sha=$(git commit-tree -p origin/main -m 'Keep scheduled workflow alive' 'origin/main^{tree}')
            git push origin "$sha:main"
            echo "Pushed keepalive commit $sha"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build data
        run: node scripts/build-data.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
